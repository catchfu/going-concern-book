<svg xmlns="http://www.w3.org/2000/svg" width="450" height="235" viewBox="0 0 450 235">
<rect width="450" height="235" fill="#ffffff"/>
<text x="0" y="5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#16161a" text-anchor="start">THE SCOREBOARD, AUGUST 2026</text>
<line x1="0" y1="11" x2="450" y2="11" stroke="#16161a" stroke-width="0.8"/>
<text x="0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#6b6b70" text-anchor="start">Figures as reported; see the notes in chapters 9-13.</text>
<rect x="0" y="29" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="9" y="51" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c8102e" text-anchor="start">$1</text>
<text x="9" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">agreed price of the defence</text>
<text x="9" y="70.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">unit; Capgemini assumes</text>
<text x="9" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">about $200m in entitlements</text>
<rect x="115" y="29" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="124" y="51" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">$557m</text>
<text x="124" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">partnership borrowings —</text>
<text x="124" y="70.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">'record high personal</text>
<text x="124" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">borrowings' under former CEO</text>
<text x="124" y="85.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">Yates</text>
<rect x="230" y="29" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="239" y="51" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">~$814k</text>
<text x="239" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">implied personal liability per</text>
<text x="239" y="70.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">partner — 'a surprisingly large</text>
<text x="239" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">figure'</text>
<rect x="345" y="29" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="354" y="51" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">$300k</text>
<text x="354" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">debt-funded buy-in now facing</text>
<text x="354" y="70.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">anyone joining the partnership</text>
<rect x="0" y="129" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="9" y="151" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">$442m</text>
<text x="9" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">government contracts under</text>
<text x="9" y="170.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">reconsideration</text>
<rect x="115" y="129" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="124" y="151" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">$2m</text>
<text x="124" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">reported executive payouts</text>
<text x="124" y="170.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">ahead of the August inquiry</text>
<rect x="230" y="129" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="239" y="151" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">50 + 450</text>
<text x="239" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">partners and client-facing staff</text>
<text x="239" y="170.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">in the August cull</text>
<rect x="345" y="129" width="105" height="88" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="354" y="151" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#16161a" text-anchor="start">&lt;10,000</text>
<text x="354" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">staff remaining — 'a little less</text>
<text x="354" y="170.5" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">than 10,000', and shrinking</text>
<text x="354" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="6.3" fill="#6b6b70" text-anchor="start">further</text>
</svg>
