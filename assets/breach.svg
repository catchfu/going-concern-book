<svg xmlns="http://www.w3.org/2000/svg" width="450" height="175" viewBox="0 0 450 175">
<rect width="450" height="175" fill="#ffffff"/>
<text x="0" y="5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#16161a" text-anchor="start">HOW THE PAPERS TRAVELLED — AS ALLEGED</text>
<line x1="0" y1="11" x2="450" y2="11" stroke="#16161a" stroke-width="0.8"/>
<text x="0" y="170" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#6b6b70" text-anchor="start">Allegations made under parliamentary privilege; contested in part by the firm. See chapter 4 notes.</text>
<rect x="0" y="59" width="134" height="76" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="9" y="75" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16161a" text-anchor="start">LENDLEASE BOARD PAPERS</text>
<text x="9" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">Confidential strategy, projections and</text>
<text x="9" y="97.5" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">deal terms of KPMG's audit client.</text>
<rect x="158" y="59" width="134" height="76" fill="#f2f2ee" stroke="#c8102e" stroke-width="1.2"/>
<text x="167" y="75" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16161a" text-anchor="start">KPMG AUDIT TEAM</text>
<text x="167" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">Six partners alleged to have accessed</text>
<text x="167" y="97.5" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">rival proposals; a client-winning war</text>
<text x="167" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">room; 'no Chinese wall'.</text>
<rect x="316" y="59" width="134" height="76" fill="#f2f2ee" stroke="#ddddd8" stroke-width="0.8"/>
<text x="325" y="75" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16161a" text-anchor="start">RIVAL PITCHES</text>
<text x="325" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">Tenders at Optus, Telstra, Dexus and</text>
<text x="325" y="97.5" font-family="Helvetica, Arial, sans-serif" font-size="6.4" fill="#6b6b70" text-anchor="start">Westpac.</text>
